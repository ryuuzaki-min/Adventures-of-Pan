name: Rakit Petualangan Panpan dan Akapan
# Menghasilkan dua berkas di setiap rilis:
#  - petualangan-panpan-akapan.apk       : dipasang langsung; memberi tahu kalau ada versi baru
#  - petualangan-panpan-akapan-play.aab  : diunggah ke Google Play Console

# Jalan otomatis setiap kali proyek.zip atau berkas ini diganti di cabang main.
# Bisa juga dijalankan manual dari tab Actions (tombol "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/rakit-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rakit-apk
  cancel-in-progress: false

jobs:
  rakit:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Buka proyek dan baca versi
        run: |
          set -e
          # Cari semua zip proyek di repo: zip yang langsung berisi versi.txt + android/,
          # atau zip yang berisi proyek.zip di dalamnya. Yang dipakai: yang ANGKA VERSINYA PALING TINGGI.
          # (Tidak memakai tanggal commit, karena checkout GitHub hanya mengambil satu commit terakhir.)
          rm -rf src tmpzip cand && mkdir src tmpzip cand
          BEST="";BESTV="0.0.0";n=0
          while IFS= read -r z; do
            n=$((n+1));d="cand/$n";mkdir -p "$d"
            if unzip -l "$z" | grep -qE '(^|[[:space:]])versi\.txt$'; then unzip -q "$z" -d "$d"
            elif unzip -l "$z" | grep -qE '(^|[[:space:]/])proyek\.zip$'; then
              inner=$(unzip -l "$z" | grep -oE '[^[:space:]]*proyek\.zip$' | head -1)
              unzip -q -o "$z" "$inner" -d "tmpzip/$n" && unzip -q "tmpzip/$n/$inner" -d "$d"
            else continue; fi
            [ -f "$d/versi.txt" ] && [ -d "$d/android" ] || continue
            V=$(tr -d ' \r\n' < "$d/versi.txt"); echo "Ditemukan: $z (versi $V)"
            if [ "$(printf '%s\n%s\n' "$BESTV" "$V" | sort -V | tail -1)" = "$V" ] && [ "$V" != "$BESTV" -o -z "$BEST" ]; then BEST="$z";BESTV="$V";BESTD="$d"; fi
          done < <(git ls-files '*.zip')
          FOUND="$BEST"
          [ -n "$FOUND" ] || { echo "::error::Tidak ada zip proyek di repo. Unggah proyek.zip."; exit 1; }
          cp -r "$BESTD"/. src/
          echo "Memakai: $FOUND"
          test -f src/versi.txt && test -d src/android || { echo "::error::Isi zip tidak lengkap (versi.txt atau folder android tidak ada)."; exit 1; }
          VER=$(tr -d ' \r\n' < src/versi.txt)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Isi versi.txt harus seperti 1.0.0, bukan '$VER'."; exit 1; }
          IFS=. read MA MI PA <<< "$VER"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "Versi $VER"

      - name: Pastikan versi ini belum pernah dirilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Versi v$VERSION_NAME sudah pernah dirilis. Naikkan angka di versi.txt (misalnya 1.0.1), lalu unggah lagi proyek.zip."
            exit 1
          fi

      - name: Pasang kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi. Buka Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > src/android/app/rilis.jks

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rakit APK dan AAB
        working-directory: src/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp src/android/app/build/outputs/apk/github/release/app-github-release.apk petualangan-panpan-akapan.apk
          cp src/android/app/build/outputs/bundle/playRelease/app-play-release.aab petualangan-panpan-akapan-play.aab
          NOTES=src/catatan-rilis.txt
          [ -f "$NOTES" ] || { echo "Pembaruan Petualangan Panpan dan Akapan." > notes.txt; NOTES=notes.txt; }
          gh release create "v$VERSION_NAME" petualangan-panpan-akapan.apk petualangan-panpan-akapan-play.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "Petualangan Panpan dan Akapan $VERSION_NAME" \
            --notes-file "$NOTES" \
            --latest
          echo "Tautan unduh tetap: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/petualangan-panpan-akapan.apk"
